version: 2
# Commit messages follow Conventional Commits (ADR-0036): build(deps): bump ...
# Maven and Docker updates touch every service, so their PRs carry the label cross-cutting (pr-scope, ADR-0034).
updates:
  - package-ecosystem: maven
    directories:
      - /services/orders-service
      - /services/notifications-service
      - /services/catalog-service
    schedule:
      interval: weekly
    commit-message: {prefix: build, include: scope}
    labels: [dependencies, cross-cutting]
    ignore:
      # the logback appender is not in the Spring Boot BOM: its minor follows the OpenTelemetry SDK Boot manages
      # (pom.xml, otel-instrumentation.version), so it is raised by hand together with the Spring Boot update
      - dependency-name: "io.opentelemetry.instrumentation:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      # first match wins: a Spring Boot minor stays in its own PR (AGENTS.md names the version)
      spring-boot-minor:
        patterns: ["org.springframework.boot:*"]
        update-types: [minor]
      maven-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message: {prefix: ci, include: scope}
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories:
      - /services/orders-service
      - /services/notifications-service
      - /services/catalog-service
    schedule:
      interval: weekly
    commit-message: {prefix: build, include: scope}
    labels: [dependencies, cross-cutting]
    ignore:
      # the JDK is pinned to the LTS line (ADR-0008); a new major is a decision, not an update
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
