version: 2
updates:
  - package-ecosystem: maven
    directories:
      - /services/orders-service
      - /services/notifications-service
      - /services/catalog-service
    schedule:
      interval: weekly
    groups:
      maven-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories:
      - /services/orders-service
      - /services/notifications-service
      - /services/catalog-service
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
