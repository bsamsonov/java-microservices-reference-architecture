name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [orders-service, notifications-service, catalog-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      # Testcontainers use the Docker daemon of the runner
      - run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/*-reports/
          if-no-files-found: ignore
      - name: Build the image (not pushed)
        run: docker build -t ${{ matrix.service }}:ci .

  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.0.0
      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - name: Lint the chart with every service's values
        run: |
          for values in services/*/deploy/values.yaml; do
            helm lint charts/spring-service -f "$values"
          done
      # CRDs (Strimzi KafkaTopic, Prometheus ServiceMonitor) have no schemas in the default catalog,
      # so -ignore-missing-schemas skips them; core kinds are still validated strictly.
      - name: Validate rendered manifests
        shell: bash   # adds pipefail: a failing helm template must fail the step
        run: |
          for values in services/*/deploy/values.yaml; do
            helm template svc charts/spring-service -f "$values" \
              | kubeconform -strict -ignore-missing-schemas -summary
          done

  alerting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The script runs pyrra, promtool, amtool and pint in pinned containers
      - run: observability/check-alerting.sh
      # The script regenerates the SLO rules; committed copies must match
      - name: Generated rules are up to date
        run: git diff --exit-code -- observability/prometheus/generated/

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole history, not only the last commit
      # Reads .gitleaks.toml: default rules plus the allowlist for local demo values
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write   # summary comment when the check fails
    steps:
      - uses: actions/checkout@v7
      # A pull request that adds a dependency with a known high or critical vulnerability fails
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
