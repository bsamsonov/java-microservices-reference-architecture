{{- if .Values.networkPolicy.enabled }}
# The pod accepts and opens only the connections listed in values.networkPolicy.
# Everything else is blocked by the namespace default-deny (platform/manifests/apps/default-deny.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "spring-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "spring-service.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- range .Values.networkPolicy.ingressFrom }}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .namespace }}}}
      ports:
        - port: http
    {{- end }}
  egress:
    - ports:   # DNS
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- range .Values.networkPolicy.egressTo }}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .namespace }}}}
      {{- with .port }}
      ports:
        - port: {{ . }}
      {{- end }}
    {{- end }}
{{- end }}
