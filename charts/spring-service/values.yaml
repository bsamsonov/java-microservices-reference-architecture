image:
  repository: ""            # required
  tag: ""                   # defaults to the chart appVersion; Tilt substitutes its own tag
  pullPolicy: IfNotPresent
replicaCount: 1
containerPort: 8080

# Rollout without failed requests or stuck work (ADR-0038).
# The new pod is Ready before the old one stops; the old one leaves the endpoints before Spring starts to shut down.
rollout:
  maxSurge: 1
  maxUnavailable: 0
shutdown:
  preStopSleepSeconds: 10           # time for endpoints and the ingress to stop sending traffic to the pod
  terminationGracePeriodSeconds: 75 # preStop 10 + web server drain (timeout-per-shutdown-phase 30) + executor await 20 + margin
# Rendered only when replicaCount > 1: with one replica it would block a node drain forever.
podDisruptionBudget:
  minAvailable: 1

# Plain env vars
env: {}
# Env vars from secrets: [{name: SPRING_DATASOURCE_PASSWORD, secret: pg-<db>, key: password}]
secretEnv: []

resources:
  requests: {cpu: 100m, memory: 384Mi}
  limits: {memory: 512Mi}

probes:
  liveness: /actuator/health/liveness
  readiness: /actuator/health/readiness
  startupFailureThreshold: 30   # x 5s: time allowed for start-up (JVM + Flyway)

serviceMonitor:
  enabled: true
  path: /actuator/prometheus
  interval: 15s

# Network access of the pod (NetworkPolicy); everything not listed is blocked. DNS is always allowed.
networkPolicy:
  enabled: true
  ingressFrom:                    # who may call the service
    - {namespace: kube-system}    # ingress controller (traefik)
    - {namespace: observability}  # Prometheus scrapes /actuator/prometheus
  egressTo:                       # where the service may connect
    - {namespace: infra}          # Postgres, Kafka, Keycloak
    - {namespace: observability, port: 4318}   # OTLP traces and logs

# Strimzi topics owned by this service
kafka:
  cluster: blueprints
  namespace: infra
  topics: []                    # [{name: orders.events, partitions: 3, retentionMs: 604800000}]

ingress:
  enabled: false
  host: ""
