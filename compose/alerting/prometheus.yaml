# Prometheus config for grafana/otel-lgtm in compose = the image's /otel-lgtm/prometheus.yaml
# plus rule_files and alerting (the only blueprints additions are marked below).
# Re-copy the upstream part when the otel-lgtm image changes: docker run --rm --entrypoint cat grafana/otel-lgtm:0.37.0 /otel-lgtm/prometheus.yaml
---
global:
  scrape_native_histograms: true
otlp:
  keep_identifying_resource_attributes: true
  # Recommended attributes to be promoted to labels.
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment # backward compatibility
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database # used by otelcol/receiver/mongodb
    - kafka.cluster.alias
storage:
  tsdb:
    # A 10min time window is enough because it can easily absorb retries and network delays.
    out_of_order_time_window: 10m
# --- blueprints: alerting ---
rule_files:
  - /blueprints/prometheus/rules/*.rules.yaml   # observability/prometheus/rules
  - /blueprints/prometheus/generated/*.yaml     # SLO rules from pyrra generate
  - /blueprints/compose-rules/*.rules.yaml      # compose only: Watchdog (kube-prometheus-stack has its own)
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
