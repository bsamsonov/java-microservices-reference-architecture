# SLO: 99% of successful HTTP requests of each Spring service take at most 500 ms, over 4 weeks.
# Needs the exact bucket le="0.5": every service sets
#   management.metrics.distribution.slo.http.server.requests: 500ms
# Alerts are generated into ../prometheus/generated/ by observability/check-alerting.sh.
apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: http-latency
  namespace: observability
  # pyrra.dev/* annotations are copied into every generated alert (the notification template shows summary).
  # Templates see only series labels: the tier labels short/long/exhaustion are rule labels and are not available here.
  annotations:
    pyrra.dev/summary: "{{ $labels.application }}: too many requests slower than 500 ms, the error budget burns too fast"
    pyrra.dev/description: "SLO: 99% of successful requests within 500 ms over 4 weeks. The tier (windows and time to exhaustion) is in the labels short, long and exhaustion."
  labels:
    pyrra.dev/team: blueprints
spec:
  target: "99"
  window: 4w
  description: HTTP requests of a Spring service served within 500 ms.
  indicator:
    latency:
      success:
        metric: http_server_requests_seconds_bucket{uri!~"/actuator.*", status!~"5..", le="0.5"}
      total:
        metric: http_server_requests_seconds_count{uri!~"/actuator.*", status!~"5.."}
      grouping:
        - application
  alerting:
    name: HttpLatencyBudgetBurn
    absent: false
