openapi: 3.0.3
info:
  title: Catalog API
  version: 0.1.0
  description: >
    Contract-first API of catalog-service (template 2: plain CRUD). Controllers implement interfaces generated
    from this file. Updates use optimistic locking: the client sends the version it has read, a stale version is 409.
tags:
  - name: Products
# Every operation needs an access token from Keycloak (security/README.md); its description names the permission.
security:
  - accessToken: []
paths:
  /products:
    post:
      tags: [Products]
      operationId: createProduct
      description: 'Requires permission `catalog:write`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProductRequest'}
      responses:
        '201':
          description: Product created
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Problem'}
    get:
      tags: [Products]
      operationId: listProducts
      description: 'Requires permission `catalog:read`.'
      parameters:
        - {name: page, in: query, schema: {type: integer, format: int32, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 20}}
        - {name: activeOnly, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Page of products sorted by code
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductPage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /products/{productId}:
    parameters:
      - {$ref: '#/components/parameters/ProductId'}
    get:
      tags: [Products]
      operationId: getProduct
      description: 'Requires permission `catalog:read`.'
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Products]
      operationId: updateProduct
      description: 'Requires permission `catalog:write`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProductRequest'}
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Products]
      operationId: deleteProduct
      description: 'Requires permission `catalog:write`.'
      responses:
        '204': {description: Product deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Unauthorized:
      description: No access token, or it is invalid or expired
    Forbidden:
      description: The token lacks the permission this operation requires
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    CreateProductRequest:
      type: object
      required: [code, name, price]
      properties:
        code: {type: string, pattern: '^[A-Z0-9-]{1,32}$', description: 'Business key, unique, immutable'}
        name: {type: string, minLength: 1, maxLength: 200}
        price: {type: number, minimum: 0}
    UpdateProductRequest:
      type: object
      required: [name, price, active, version]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        price: {type: number, minimum: 0}
        active: {type: boolean}
        version: {type: integer, format: int64, description: 'Version from the last read'}
    ProductResponse:
      type: object
      required: [id, code, name, price, active, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        price: {type: number}
        active: {type: boolean}
        version: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ProductPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ProductResponse'}
        page: {type: integer, format: int32}
        size: {type: integer, format: int32}
        totalElements: {type: integer, format: int64}
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
