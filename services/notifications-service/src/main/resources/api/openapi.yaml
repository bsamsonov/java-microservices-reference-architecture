openapi: 3.0.3
info:
  title: Notifications API
  version: 0.1.0
  description: Contract-first API of notifications-service (read-only). Notifications are created from order events in Kafka.
tags:
  - name: Notifications
# Every operation needs an access token from Keycloak (security/README.md); its description names the permission.
security:
  - accessToken: []
paths:
  /notifications:
    get:
      tags: [Notifications]
      operationId: findNotifications
      description: 'Requires permission `notifications:read`.'
      parameters:
        - name: customerId
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 64}
      responses:
        '200':
          description: Notifications of the customer, newest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/NotificationResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /notifications/{notificationId}:
    get:
      tags: [Notifications]
      operationId: getNotification
      description: 'Requires permission `notifications:read`.'
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Notification
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: No access token, or it is invalid or expired
    Forbidden:
      description: The token lacks the permission this operation requires
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    NotificationType:
      type: string
      enum: [ORDER_PLACED, ORDER_CANCELLED]
    NotificationChannel:
      type: string
      enum: [EMAIL]
    NotificationStatus:
      type: string
      enum: [PENDING, SENT, FAILED]
    NotificationResponse:
      type: object
      required: [id, orderId, customerId, type, channel, status, text, createdAt]
      properties:
        id: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        customerId: {type: string}
        type: {$ref: '#/components/schemas/NotificationType'}
        channel: {$ref: '#/components/schemas/NotificationChannel'}
        status: {$ref: '#/components/schemas/NotificationStatus'}
        text: {type: string}
        createdAt: {type: string, format: date-time}
        sentAt: {type: string, format: date-time}
        failureReason: {type: string}
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
